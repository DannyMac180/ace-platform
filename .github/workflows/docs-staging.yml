name: Deploy Docs to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-staging.yml'

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Install Fly.io CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          "$HOME/.fly/bin/flyctl" version

      - name: Deploy to Staging
        run: |
          set -euo pipefail

          deploy_docs() {
            local depot_flag="$1"
            flyctl deploy \
              --config fly.staging.toml \
              --remote-only \
              --wait-timeout 10m \
              --depot="${depot_flag}"
          }

          for attempt in 1 2 3; do
            echo "Docs deploy attempt ${attempt}/3"

            if [[ "${attempt}" -eq 1 ]]; then
              depot="true"
            else
              depot="false"
            fi

            if deploy_docs "${depot}"; then
              echo "Docs deploy succeeded on attempt ${attempt}"
              exit 0
            fi

            if [[ "${attempt}" -lt 3 ]]; then
              sleep_seconds=$((attempt * 45))
              echo "Docs deploy attempt ${attempt} failed. Retrying in ${sleep_seconds}s..."
              sleep "${sleep_seconds}"
            fi
          done

          echo "Docs deploy failed after 3 attempts."
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment
        run: |
          sleep 10
          curl -f https://ace-platform-docs-staging.fly.dev/health || exit 1
