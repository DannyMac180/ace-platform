name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  BACKEND_APP: ace-platform-staging
  FRONTEND_APP: ace-platform-web-staging
  BACKEND_HEALTH_URL: https://ace-platform-staging.fly.dev/health
  FRONTEND_HEALTH_URL: https://ace-platform-web-staging.fly.dev/
  RELEASE_LABEL: ${{ github.sha }}

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ace_test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/ace_test
          TEST_DATABASE_URL_ASYNC: postgresql+asyncpg://test:test@localhost:5432/ace_test
          TEST_DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/ace_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
          OPENAI_API_KEY: sk-test-fake-key
        run: pytest tests/ -v --ignore=tests/test_e2e_billing_flow.py -q

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Run tests
        working-directory: web
        run: npx vitest run

      - name: Build
        working-directory: web
        env:
          VITE_API_URL: https://ace-platform-staging.fly.dev
          VITE_DOCS_URL: https://ace-platform-docs-staging.fly.dev/docs
          VITE_SENTRY_ENVIRONMENT: staging
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: "0.0"
        run: npm run build

  build-backend-artifact:
    name: Build Backend Artifact
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - uses: actions/checkout@v4

      - name: Build backend staging artifact
        run: docker build --target production -t ace-platform/backend:${{ github.sha }} .

  build-frontend-artifact:
    name: Build Frontend Artifact
    runs-on: ubuntu-latest
    needs: test-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend staging artifact
        run: |
          docker build \
            --build-arg VITE_API_URL=https://ace-platform-staging.fly.dev \
            --build-arg VITE_DOCS_URL=https://ace-platform-docs-staging.fly.dev/docs \
            --build-arg VITE_SENTRY_ENVIRONMENT=staging \
            --build-arg VITE_SENTRY_RELEASE=${{ github.sha }} \
            --build-arg VITE_SENTRY_TRACES_SAMPLE_RATE=0.0 \
            -t ace-platform/web:${{ github.sha }} \
            web

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend
      - build-backend-artifact
      - build-frontend-artifact
    timeout-minutes: 45
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend app
        run: |
          set -euo pipefail

          cleanup_stale_release_machines() {
            local stale_ids
            stale_ids="$(flyctl machine list -a "${BACKEND_APP}" --json | jq -r '.[] | select(.config.metadata.fly_process_group == "fly_app_release_command") | select(.state == "created" or .state == "pending" or .state == "starting" or .state == "stopped" or .state == "suspended" or .state == "replacing") | .id')"

            if [[ -z "${stale_ids}" ]]; then
              echo "No stale release command machines detected."
              return 0
            fi

            echo "Cleaning up stale release command machines:"
            while IFS= read -r machine_id; do
              [[ -z "${machine_id}" ]] && continue
              echo " - Destroying ${machine_id}"
              flyctl machine destroy "${machine_id}" -a "${BACKEND_APP}" --force || true
            done <<< "${stale_ids}"
          }

          deploy_backend() {
            local depot_flag="$1"
            flyctl deploy \
              --app "${BACKEND_APP}" \
              --config fly.staging.toml \
              --image-label "${RELEASE_LABEL}" \
              --remote-only \
              --wait-timeout 15m \
              --release-command-timeout 20m \
              --depot="${depot_flag}"
          }

          for attempt in 1 2 3; do
            echo "Backend deploy attempt ${attempt}/3"
            cleanup_stale_release_machines

            if [[ "${attempt}" -eq 1 ]]; then
              depot="true"
            else
              depot="false"
            fi

            if deploy_backend "${depot}"; then
              echo "Backend deploy succeeded on attempt ${attempt}"
              exit 0
            fi

            if [[ "${attempt}" -lt 3 ]]; then
              sleep_seconds=$((attempt * 45))
              echo "Backend deploy attempt ${attempt} failed. Retrying in ${sleep_seconds}s..."
              sleep "${sleep_seconds}"
            fi
          done

          echo "Backend deploy failed after 3 attempts."
          exit 1

      - name: Deploy frontend app
        working-directory: web
        run: |
          set -euo pipefail

          deploy_frontend() {
            local depot_flag="$1"
            flyctl deploy \
              --app "${FRONTEND_APP}" \
              --config fly.staging.toml \
              --image-label "${RELEASE_LABEL}" \
              --build-arg VITE_API_URL=https://ace-platform-staging.fly.dev \
              --build-arg VITE_DOCS_URL=https://ace-platform-docs-staging.fly.dev/docs \
              --build-arg VITE_SENTRY_DSN="${{ secrets.FRONTEND_VITE_SENTRY_DSN }}" \
              --build-arg VITE_SENTRY_ENVIRONMENT=staging \
              --build-arg VITE_SENTRY_RELEASE="${RELEASE_LABEL}" \
              --build-arg VITE_SENTRY_TRACES_SAMPLE_RATE=0.0 \
              --remote-only \
              --wait-timeout 10m \
              --depot="${depot_flag}"
          }

          for attempt in 1 2 3; do
            echo "Frontend deploy attempt ${attempt}/3"
            if [[ "${attempt}" -eq 1 ]]; then
              depot="true"
            else
              depot="false"
            fi

            if deploy_frontend "${depot}"; then
              echo "Frontend deploy succeeded on attempt ${attempt}"
              exit 0
            fi

            if [[ "${attempt}" -lt 3 ]]; then
              echo "Frontend deploy attempt ${attempt} failed. Retrying in 30s..."
              sleep 30
            fi
          done

          echo "Frontend deploy failed after 3 attempts."
          exit 1

      - name: Verify backend health
        run: |
          sleep 10
          curl -fsSL "${BACKEND_HEALTH_URL}" >/dev/null

      - name: Verify backend process groups
        run: |
          set -euo pipefail
          machines_json="$(flyctl machine list -a "${BACKEND_APP}" --json)"

          for process in api worker beat; do
            running_count="$(jq --arg process "${process}" '[.[] | select(.config.metadata.fly_process_group == $process) | select(.state == "started" or .state == "running")] | length' <<< "${machines_json}")"
            if [[ "${running_count}" -lt 1 ]]; then
              echo "Expected at least one running ${process} machine for ${BACKEND_APP}"
              exit 1
            fi
          done

      - name: Verify frontend health
        run: curl -fsSL "${FRONTEND_HEALTH_URL}" >/dev/null

      - name: Deployment summary
        run: |
          echo "## Staging Deployment Complete" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Backend app: ${BACKEND_APP}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Frontend app: ${FRONTEND_APP}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Release label: ${RELEASE_LABEL}" >> "${GITHUB_STEP_SUMMARY}"
